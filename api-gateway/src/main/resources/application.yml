spring:
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      rule: random
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/blog-service/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comment-service/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/